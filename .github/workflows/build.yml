name: Build RPM

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
    - uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        dnf install -y rpm-build rpmlint python3-pyyaml

    - name: Build RPM
      run: |
        mkdir -p ~/rpmbuild/{SPECS,SOURCES,BUILD,RPMS,SRPMS}
        cp rpm/mountdesk.spec ~/rpmbuild/SPECS/
        cd ~/rpmbuild/SPECS
        # Create source tarball from src/
        tar czf ~/rpmbuild/SOURCES/mountdesk-$(grep '^Version:' mountdesk.spec | awk '{print $2}').tar.gz -C ${{ github.workspace }} src rpm LICENSE README.md
        rpmbuild -ba mountdesk.spec

    - name: Lint RPM
      run: |
        rpmlint ~/rpmbuild/RPMS/noarch/*.rpm || true

    - name: Upload RPM
      uses: actions/upload-artifact@v4
      with:
        name: mountdesk-rpm
        path: ~/rpmbuild/RPMS/noarch/*.rpm

    - name: Upload SRPM
      uses: actions/upload-artifact@v4
      with:
        name: mountdesk-srpm
        path: ~/rpmbuild/SRPMS/*.rpm

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/**/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
