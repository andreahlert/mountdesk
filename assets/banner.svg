<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4285F4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#34A853;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FBBC05;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="0.5" opacity="0.05"/>
  </pattern>
  <rect width="1200" height="400" fill="url(#grid)"/>
  
  <!-- Left side: Logo icon -->
  <g transform="translate(120, 120) scale(1.3)">
    <!-- Cloud -->
    <path d="M 120 40 C 120 15, 100 0, 80 0 C 60 0, 45 12, 40 28 C 15 28, 0 45, 0 68 C 0 92, 20 108, 45 108 L 105 108 C 130 108, 148 90, 148 68 C 148 48, 135 35, 120 32 C 118 35, 116 38, 120 40 Z" 
          fill="white" opacity="0.95"/>
    <!-- Monitor base -->
    <rect x="30" y="95" width="88" height="7" rx="3.5" fill="white" opacity="0.9"/>
    <rect x="52" y="102" width="44" height="5" rx="2.5" fill="white" opacity="0.7"/>
    <!-- Folder -->
    <path d="M 45 58 L 45 50 C 45 46, 49 44, 53 44 L 68 44 C 70 44, 72 46, 74 48 L 76 52 L 95 52 C 99 52, 101 54, 101 58 L 101 75 C 101 79, 99 81, 95 81 L 49 81 C 45 81, 43 79, 43 75 L 43 62 C 43 60, 44 58, 45 58 Z" 
          fill="url(#accent)" opacity="0.95"/>
  </g>
  
  <!-- Right side: Text -->
  <text x="420" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="white" letter-spacing="-2">MountDesk</text>
  
  <text x="425" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="white" opacity="0.85">Monte seus Google Drives no desktop Linux</text>
  
  <!-- Accent line -->
  <rect x="425" y="260" width="180" height="4" rx="2" fill="url(#accent)" filter="url(#glow)"/>
  
  <!-- Feature pills -->
  <g transform="translate(425, 290)">
    <rect x="0" y="0" width="140" height="32" rx="16" fill="white" opacity="0.12"/>
    <text x="70" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="white" text-anchor="middle">GTK4 Wizard</text>
    
    <rect x="155" y="0" width="110" height="32" rx="16" fill="white" opacity="0.12"/>
    <text x="210" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="white" text-anchor="middle">App Window</text>
    
    <rect x="280" y="0" width="100" height="32" rx="16" fill="white" opacity="0.12"/>
    <text x="330" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="white" text-anchor="middle">App Mode</text>
    
    <rect x="395" y="0" width="120" height="32" rx="16" fill="white" opacity="0.12"/>
    <text x="455" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="white" text-anchor="middle">rclone FUSE</text>
  </g>
  
  <!-- Bottom: Fedora badge -->
  <text x="425" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="white" opacity="0.6">Made for Fedora • MIT License • 2026</text>
</svg>
