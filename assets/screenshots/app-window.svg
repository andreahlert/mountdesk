<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" width="520" height="460">
  <defs>
    <linearGradient id="hdr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
    <filter id="shd" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <clipPath id="win"><rect width="520" height="460" rx="12"/></clipPath>
  </defs>

  <!-- Window -->
  <rect width="520" height="460" rx="12" fill="white" filter="url(#shd)"/>

  <!-- Header Bar -->
  <rect width="520" height="56" fill="url(#hdr)"/>
  <rect x="16" y="14" width="28" height="28" rx="7" fill="white" opacity="0.95"/>
  <text x="54" y="35" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="white">MountDesk</text>

  <!-- Drive 1: My Drive -->
  <g transform="translate(20,76)">
    <rect width="480" height="88" rx="10" fill="#fafafa" stroke="#e8e8e8" stroke-width="1"/>
    <rect x="16" y="16" width="40" height="40" rx="10" fill="url(#hdr)" opacity="0.9"/>
    <text x="28" y="42" font-family="sans-serif" font-size="20">📁</text>
    <text x="70" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">My Drive</text>
    <text x="70" y="48" font-family="sans-serif" font-size="11" fill="#888">~/Cloud/MyDrive</text>
    <text x="400" y="30" font-family="sans-serif" font-size="12" font-weight="600" fill="#34a853">🟢 Mounted</text>
    <rect x="280" y="52" width="90" height="28" rx="6" fill="white" stroke="#ddd"/>
    <text x="325" y="70" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">📂 Open folder</text>
    <rect x="380" y="52" width="90" height="28" rx="6" fill="#1a73e8"/>
    <text x="425" y="70" font-family="sans-serif" font-size="11" fill="white" text-anchor="middle">🌐 Open in Drive</text>
  </g>

  <!-- Drive 2: Work -->
  <g transform="translate(20,176)">
    <rect width="480" height="88" rx="10" fill="#fafafa" stroke="#e8e8e8" stroke-width="1"/>
    <rect x="16" y="16" width="40" height="40" rx="10" fill="url(#hdr)" opacity="0.9"/>
    <text x="28" y="42" font-family="sans-serif" font-size="20">📁</text>
    <text x="70" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Work</text>
    <text x="70" y="48" font-family="sans-serif" font-size="11" fill="#888">~/Cloud/Work</text>
    <text x="400" y="30" font-family="sans-serif" font-size="12" font-weight="600" fill="#34a853">🟢 Mounted</text>
    <rect x="280" y="52" width="90" height="28" rx="6" fill="white" stroke="#ddd"/>
    <text x="325" y="70" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">📂 Open folder</text>
    <rect x="380" y="52" width="90" height="28" rx="6" fill="#1a73e8"/>
    <text x="425" y="70" font-family="sans-serif" font-size="11" fill="white" text-anchor="middle">🌐 Open in Drive</text>
  </g>

  <!-- Drive 3: Photos (unmounted) -->
  <g transform="translate(20,276)">
    <rect width="480" height="88" rx="10" fill="#fafafa" stroke="#e8e8e8" stroke-width="1"/>
    <rect x="16" y="16" width="40" height="40" rx="10" fill="#999" opacity="0.5"/>
    <text x="28" y="42" font-family="sans-serif" font-size="20">📁</text>
    <text x="70" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#1a1a1a">Photos</text>
    <text x="70" y="48" font-family="sans-serif" font-size="11" fill="#888">~/Cloud/Photos</text>
    <text x="400" y="30" font-family="sans-serif" font-size="12" font-weight="600" fill="#e01b24">🔴 Unmounted</text>
    <rect x="280" y="52" width="90" height="28" rx="6" fill="white" stroke="#ddd"/>
    <text x="325" y="70" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle">📂 Open folder</text>
    <rect x="380" y="52" width="90" height="28" rx="6" fill="#1a73e8"/>
    <text x="425" y="70" font-family="sans-serif" font-size="11" fill="white" text-anchor="middle">🌐 Open in Drive</text>
  </g>

  <!-- Bottom actions -->
  <g transform="translate(0,390)">
    <rect x="20" y="0" width="110" height="34" rx="17" fill="white" stroke="#ddd" stroke-width="1"/>
    <text x="75" y="22" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">🔄 Sync icons</text>
    <rect x="145" y="0" width="110" height="34" rx="17" fill="#1a73e8"/>
    <text x="200" y="22" font-family="sans-serif" font-size="12" fill="white" text-anchor="middle">⚙️ Configure</text>
    <rect x="270" y="0" width="80" height="34" rx="17" fill="white" stroke="#ddd" stroke-width="1"/>
    <text x="310" y="22" font-family="sans-serif" font-size="12" fill="#333" text-anchor="middle">Quit</text>
  </g>
</svg>
